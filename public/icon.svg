<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <circle cx="256" cy="256" r="190" stroke="rgba(255,255,255,0.18)" stroke-width="4" fill="none" />
  <circle cx="256" cy="256" r="140" stroke="rgba(255,255,255,0.22)" stroke-width="4" stroke-dasharray="8 8" fill="none" />
  <!-- Sound Wave Frequency Bars -->
  <g fill="#FFFFFF" filter="url(#glow)">
    <rect x="146" y="200" width="22" height="112" rx="11" />
    <rect x="196" y="152" width="22" height="208" rx="11" />
    <rect x="245" y="112" width="22" height="288" rx="11" />
    <rect x="294" y="152" width="22" height="208" rx="11" />
    <rect x="344" y="200" width="22" height="112" rx="11" />
  </g>
</svg>